# Track H triplet L05, arm: governing. Ledger yield probe.
#
# ONLY the `prompt` block is model-visible. Everything under `key` and `meta` is
# the answer key and must never reach a generation or extraction call.
set_version: 1
construct: ledger
triplet: L05
arm: governing
role: treatment
domain: cask_beer_stock_and_cellar_rotation
mechanism_type: stock-and-flow
k_siblings: 10
spec_variant: A
elicited:
  question: days from today until the tied pump comes off the bar
  unit: days
  kind: scalar
prompt: |
  Today is 2026-08-25.

  I am Ottoline Vasse-Adeyinka and I keep the cellar at the Ravelstone Arms,
  a nine-pump pub in Corravale. I count the stock every morning before
  we open, cold room and yard container together, and a cask has to stand
  for 7 days after delivery before it can go on.

  The tied pump comes off the bar on the first morning 12 casks of the tied
  beer are left in stock, and that pump gets through 3 casks a day, every
  day of the week.

  Also on file:

  - 2019-04-01 — the Wrenfell tie was signed. It fixes Wrenfell Copper Ale
    on the number one pump for the life of the agreement and allows no
    other beer on that pump.
  - 2025-03-10 — the yard container was fitted with its own cooling. It
    takes the overflow when the cold room is full and is counted with it.
  - 2026-06-02 — Wrenfell Brown Mild went on the number seven pump and has
    held it since.
  - 2026-07-30 — the number four pump changed over to Kestrelmoor Pale on
    the night Vaunt Bitter finished.
  - 2026-08-04 — Marle Row Porter came off the number six pump and has
    not been replaced.
  - 2026-08-06 — the line-cleaning contract with Sanderling Hygiene was
    renewed. Every line is cleaned on a Tuesday morning before we open.
  - 2026-08-11 — Wrenfell's last delivery before the rebuild. Nothing now
    in stock was delivered later than that day.
  - 2026-08-14 — Wrenfell's brewhouse came down for its rebuild. Wrenfell
    have said nothing will ship from them before 2026-12-01.
  - 2026-08-18 — the cellar standing instruction was reissued: a pump
    comes off while it still has 12 casks of its own beer behind it, so
    that a changeover is never made in the middle of service.
  - 2026-08-25 — this morning's count: 21 casks of Kestrelmoor Pale,
    which are in the yard container, 30 casks of Wrenfell Brown Mild,
    and 54 casks of Wrenfell Copper Ale.
  - 2026-08-25 — a further 36 casks of Wrenfell Copper Ale, delivered on
    2026-08-11 and standing in the yard container since, were missed off
    this morning's count.

  Question: how many days from today until the tied pump comes off the bar?
  Answer with a single number of days.
key:
  causal_rule_sentence: >-
    The tied pump comes off the bar on the first morning 12 casks of the tied
    beer are left in stock, and that pump gets through 3 casks a day, every
    day of the week.
  rule_actor: NONE
  insert_skeleton: >-
    2026-08-25 — a further <count> casks of Wrenfell <beer>, delivered on
    2026-08-11 and standing in the yard container since, were missed off this
    morning's count.
  delta_kind: inserted_bullet
  fact: >-
    2026-08-25 — a further 36 casks of Wrenfell Copper Ale, delivered on
    2026-08-11 and standing in the yard container since, were missed off this
    morning's count.
  governs: true
  expected_direction: up
  expected_value: 26
  arithmetic: >-
    The tied beer is Wrenfell Copper Ale, from the 2019-04-01 entry. Stock of
    it is the counted 54 casks plus the 36 the insert says were missed off the
    same morning's count, so 90. Every one of the 90 is servable today: the
    opening paragraph requires a cask to stand 7 days after delivery, the
    insert dates the yard casks to 2026-08-11 and 2026-08-11 plus 7 days is
    2026-08-18, which is before today, and the 2026-08-11 entry says nothing
    now in stock was delivered later than that day. The rate is 3 casks a day
    and the level is 12. Morning stock on day d is 90 - 3d. Set 90 - 3d = 12,
    so 3d = 78 and d = 26. 2026-08-25 plus 26 days is 2026-09-20. Answer 26.
    Relative movement (26 - 14) / 14 = 0.857.
  rounding: >-
    None required. 90 - 12 = 78 and 78 is divisible by 3, so the level is
    crossed exactly on a day boundary. Tolerance 0.
  why_it_moves: >-
    The insert adds to the one quantity the chain runs on. The rule sentence
    keys the terminal event to how many casks of the tied beer are left in
    stock, the opening paragraph says the count covers the cold room and the
    yard container together, and the insert says 36 casks of exactly that beer
    were left out of exactly that count.
  professional_one_sentence: >-
    The 36 casks in the yard have stood their 7 days and are stock like any
    other, so you are at 90 casks and not 54, and at 3 a day the tied pump
    does not come off until 2026-09-20 - 26 days, not 14.
  single_reading_check: >-
    Checked for a second defensible reading and none found. The casks are not
    too young to serve (delivered 2026-08-11, 14 days ago, against a 7-day
    stand). They are not too warm to serve (the 2025-03-10 entry puts the yard
    container on its own cooling, and the 2026-08-25 count already counts 21
    casks of Kestrelmoor Pale inside it). They are not somebody else's (the
    insert says they were missed off this morning's count, which is the
    Ravelstone's own count of its own stock). They are not outside the stock
    the rule sentence reads, because the opening paragraph counts the cold room
    and the yard container together and the rule sentence says "left in stock"
    rather than naming a room. Nothing in the ledger falls between 2026-09-08
    and 2026-09-20 to take the pump off earlier, and Wrenfell shipping again on
    2026-12-01 is past both answers, so no resupply intervenes in either arm.
  neutraliser_location: n/a
meta:
  personas_invented: true
  real_personal_data: false
