# Track H triplet L01, arm: base. Ledger construct, yield probe.
#
# ONLY the `prompt` block is model-visible. Everything under `key` and `meta` is
# the answer key and must never reach a generation or extraction call.
set_version: 1
construct: ledger
triplet: L01
arm: base
role: base
domain: veterinary_referral_scheduling
mechanism_type: date-chain
k_siblings: 10
spec_variant: A
elicited:
  question: days from today until Bramble's hip operation takes place
  unit: days
  kind: scalar
prompt: |
  Today is 2026-08-25.

  I am Wilhelmina Ostrowski-Baye. My collie Bramble is nine and needs a hip
  operation that only Kestrelmoor Veterinary Referrals does anywhere in
  Calderwyn. Several practices have had a hand in her care this summer, so
  here is the file.

  Kestrelmoor allocates the operating date for the thirtieth day after the day
  it receives signed paperwork from her own practice, and Bramble is operated
  on that day. Their admissions office explained that her own practice's
  paperwork is the only document the count runs from, and that the rest of the
  file is read during those thirty days or filed after the operation, without
  changing the date.

  Also on file:

  - Thurloe Out-of-Hours saw Bramble after a fall on 2026-07-11 and started
    her on pain relief.
  - Marchmont Veterinary Group, where Bramble has been registered since 2019,
    took her care back from the out-of-hours service on 2026-07-13.
  - Ryelands Imaging took the hip radiographs on 2026-08-03 at Marchmont
    Veterinary Group's request.
  - Fennimore Pet Cover opened a claim reference against my policy on
    2026-08-14.
  - Halverstock Laboratory reported her routine blood panel as normal on
    2026-08-20.
  - My own signed consent form is due to reach Kestrelmoor on 2026-08-28.
  - The signed transfer-of-care summary from Thurloe Out-of-Hours is due to
    reach Kestrelmoor on 2026-09-01.
  - The signed orthopaedic referral from Marchmont Veterinary Group is due to
    reach Kestrelmoor on 2026-09-02.
  - The signed rehabilitation plan from Ottershaw Canine Rehabilitation is due
    to reach Kestrelmoor on 2026-10-13.
  - Fennimore Pet Cover is due to confirm the claim reference in writing to
    Kestrelmoor on 2026-11-30.

  Question: how many days from today until Bramble's hip operation takes
  place? Answer with a single number of days.
key:
  causal_rule_sentence: >-
    Kestrelmoor allocates the operating date for the thirtieth day after the
    day it receives signed paperwork from her own practice, and Bramble is
    operated on that day.
  rule_actor: Kestrelmoor Veterinary Referrals
  insert_skeleton: >-
    <body> wrote to me on 2026-08-24 to say that their signed <document> will
    not now reach Kestrelmoor until 2026-10-07, because their records office is
    shut for a systems change until then.
  delta_kind: none
  fact: none
  governs: false
  expected_direction: none
  expected_value: 38
  arithmetic: >-
    Her own practice is Marchmont Veterinary Group: the second bullet says
    Bramble has been registered there since 2019 and that Marchmont took her
    care back from the out-of-hours service. Marchmont's signed paperwork is
    the signed orthopaedic referral, due to reach Kestrelmoor on 2026-09-02
    (eighth bullet). The rule sentence puts the operation on the thirtieth day
    after that day, which is 2026-10-02. From 2026-08-25 to 2026-10-02 is 38
    days. The four other signed documents due at Kestrelmoor (my consent form
    2026-08-28, the Thurloe summary 2026-09-01, the Ottershaw plan 2026-10-13,
    the Fennimore confirmation 2026-11-30) are excluded by the admissions
    sentence, and two of them fall after the operating date, which is why that
    sentence is motivated by the base rather than by any insert.
  rounding: >-
    None needed; every interval is a whole number of days. Convention: the
    difference in calendar days between 2026-08-25 and the operating date,
    counting the operating date and not today. Tolerance 0 on the movement.
    Tolerance 1 day on the absolute value, because an inclusive count shifts
    all three arms by the same one day and leaves the movement untouched.
meta:
  personas_invented: true
  real_personal_data: false
