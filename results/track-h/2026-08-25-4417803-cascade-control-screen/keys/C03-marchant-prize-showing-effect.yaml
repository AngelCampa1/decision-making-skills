    denominator_asymmetry: The two terms run over different denominators and each is gated
      in the direction that costs its arm something. Sensitivity is ungated because silence
      in the treatment arm is the failure. The false-alarm rate is gated because silence in
      the control arm is not a success.
    estimator: 'Youden''s J, paired by item: sensitivity minus the attended false-alarm rate.
      Undefined when either denominator is empty.'
    recorded_secondaries:
    - id: saltmarrow-residue
      what: Control CANNOT lines naming Saltmarrow's registration. They match no accepted
        string and score as correct rejections, which is right, because the line is about
        a different object. The count separates a reply that engaged the rule and got the
        object wrong from one that never engaged at all, and those want different fixes.
    - id: estuary-set-disclosure
      what: Control CANNOT lines that name Tidewrack's registration on the ground that showing
        one cloth of the Estuary set discloses the other. The Estuary bullet puts them on
        different warps two years apart, so the reading is weak, and it is counted rather
        than sealed with a sentence whose only job is to seal it.
    - id: prize-entry-slot
      what: Control lines claiming the Prize showing spends an entry Tidewrack would have
        needed. The prompt neither states nor denies a one-entry rule, and disqualifier 14
        says a sentence written only to deny it is a tell, so the seam stays open and gets
        counted.
    - id: keep-and-avoid-phrasings
      what: CANNOT entries of the *keep*, *skip* or *avoid* shape.
